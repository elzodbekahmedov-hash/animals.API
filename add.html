<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/flowbite@4.0.1/dist/flowbite.min.css"
      rel="stylesheet"
    />
    <link href="./css/output.css" rel="stylesheet" />
    <title>Add</title>
  </head>

  <body>
    <div
      class="bg-gradient-to-r from-indigo-500 via-purple-500 to-pink-500 p-10 rounded-lg shadow-lg w-full h-full min-h-[100%] fixed"
    >
      <div class="flex flex-wrap gap-5 items-center w-full max-md:max-w-full mb-10">
        <div
          class="flex flex-wrap flex-1 shrink gap-5 items-center self-stretch my-auto basis-0 min-w-[240px] max-md:max-w-full"
        >
          <div
            class="flex relative flex-col justify-center self-stretch bg-gray-100 h-[70px] min-h-[70px] rounded-[16px] overflow-hidden w-[70px]"
          >
            <div class="w-[100px] h-[100px] aspect-auto">
              <!-- SVG -->
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 100 100" height="100" width="100">
                <g clip-path="url(#clip0_2721_15386)">
                  <rect fill="#EAEFF4" height="100" width="100"></rect>
                  <path fill="#DCE8F3" d="M-50 4.28715L20.8808 86L86 18.8693L-41.0227 -97L-50 4.28715Z"></path>
                  <path fill="#50FFD2" d="M82.3191 48.7522C82.3191 66.7029 65.9852 81.2548 45.8364 81.2548C25.6876 81.2548 9.35376 66.7029 9.35376 48.7522C9.35376 30.8014 25.6876 16.2495 45.8364 16.2495C65.9852 16.2495 82.3191 30.8014 82.3191 48.7522Z"></path>
                  <!-- qolgan svg qismini o‘zgartirmadim -->
                </g>
                <defs>
                  <clipPath id="clip0_2721_15386">
                    <rect fill="white" height="100" width="100"></rect>
                  </clipPath>
                </defs>
              </svg>
              <!-- /SVG -->
            </div>
          </div>

          <div class="flex flex-col self-stretch my-auto min-w-[240px]">
            <div class="text-base text-gray-800">animals +add</div>
            <div class="mt-2 text-sm text-gray-500">Hayvovlarga G'amxorlik qilish markazi</div>
          </div>
        </div>
      </div>

      <!-- ✅ FORM START -->
      <form id="form">
        <div class="grid grid-cols-2 gap-6 mb-10">
          <!-- name -->
          <div class="relative">
            <input
              type="text"
              name="name"
              id="name"
              class="block w-full text-sm h-[50px] px-4 text-slate-900 bg-white rounded-[8px] border border-violet-200 appearance-none focus:border-transparent focus:outline focus:outline-2 focus:outline-primary focus:ring-0 peer pr-[48px]"
              placeholder="Animal name"
              required
            />
            <label
              for="name"
              class="peer-placeholder-shown:-z-10 peer-focus:z-10 absolute text-[14px] leading-[150%] text-primary duration-300 transform -translate-y-[1.2rem] scale-75 top-2 z-10 origin-[0] bg-white px-2 peer-placeholder-shown:scale-100 peer-placeholder-shown:-translate-y-1/2 peer-placeholder-shown:top-1/2 peer-focus:top-2 peer-focus:scale-75 peer-focus:-translate-y-[1.2rem] start-1"
            >
              name
            </label>
          </div>

          <!-- category -->
          <div class="relative">
            <input
              type="text"
              name="category"
              id="category"
              class="block w-full text-sm h-[50px] px-4 text-slate-900 bg-white rounded-[8px] border border-violet-200 appearance-none focus:border-transparent focus:outline focus:outline-2 focus:outline-primary focus:ring-0 peer pr-[48px]"
              placeholder="Category (e.g. Mammal)"
              required
            />
            <label
              for="category"
              class="peer-placeholder-shown:-z-10 peer-focus:z-10 absolute text-[14px] leading-[150%] text-primary duration-300 transform -translate-y-[1.2rem] scale-75 top-2 z-10 origin-[0] bg-white px-2 peer-placeholder-shown:scale-100 peer-placeholder-shown:-translate-y-1/2 peer-placeholder-shown:top-1/2 peer-focus:top-2 peer-focus:scale-75 peer-focus:-translate-y-[1.2rem] start-1"
            >
              category
            </label>
          </div>

          <!-- speed -->
          <div class="relative">
            <input
              type="number"
              name="speed"
              id="speed"
              class="block w-full text-sm h-[50px] px-4 text-slate-900 bg-white rounded-[8px] border border-violet-200 appearance-none focus:border-transparent focus:outline focus:outline-2 focus:outline-primary focus:ring-0 peer pr-[48px]"
              placeholder="Speed (number)"
              required
            />
            <label
              for="speed"
              class="peer-placeholder-shown:-z-10 peer-focus:z-10 absolute text-[14px] leading-[150%] text-primary duration-300 transform -translate-y-[1.2rem] scale-75 top-2 z-10 origin-[0] bg-white px-2 peer-placeholder-shown:scale-100 peer-placeholder-shown:-translate-y-1/2 peer-placeholder-shown:top-1/2 peer-focus:top-2 peer-focus:scale-75 peer-focus:-translate-y-[1.2rem] start-1"
            >
              speed
            </label>
          </div>

          <!-- soundText -->
          <div class="relative">
            <input
              type="text"
              name="soundText"
              id="soundText"
              class="block w-full text-sm h-[50px] px-4 text-slate-900 bg-white rounded-[8px] border border-violet-200 appearance-none focus:border-transparent focus:outline focus:outline-2 focus:outline-primary focus:ring-0 peer pr-[48px]"
              placeholder="Sound text (e.g. Neigh)"
              required
            />
            <label
              for="soundText"
              class="peer-placeholder-shown:-z-10 peer-focus:z-10 absolute text-[14px] leading-[150%] text-primary duration-300 transform -translate-y-[1.2rem] scale-75 top-2 z-10 origin-[0] bg-white px-2 peer-placeholder-shown:scale-100 peer-placeholder-shown:-translate-y-1/2 peer-placeholder-shown:top-1/2 peer-focus:top-2 peer-focus:scale-75 peer-focus:-translate-y-[1.2rem] start-1"
            >
              soundText
            </label>
          </div>

          <!-- year -->
          <div class="relative">
            <input
              type="number"
              name="year"
              id="year"
              class="block w-full text-sm h-[50px] px-4 text-slate-900 bg-white rounded-[8px] border border-violet-200 appearance-none focus:border-transparent focus:outline focus:outline-2 focus:outline-primary focus:ring-0 peer pr-[48px]"
              placeholder="Year (number)"
              required
            />
            <label
              for="year"
              class="peer-placeholder-shown:-z-10 peer-focus:z-10 absolute text-[14px] leading-[150%] text-primary duration-300 transform -translate-y-[1.2rem] scale-75 top-2 z-10 origin-[0] bg-white px-2 peer-placeholder-shown:scale-100 peer-placeholder-shown:-translate-y-1/2 peer-placeholder-shown:top-1/2 peer-focus:top-2 peer-focus:scale-75 peer-focus:-translate-y-[1.2rem] start-1"
            >
              year
            </label>
          </div>

          <!-- weight -->
          <div class="relative">
            <input
              type="number"
              name="weight"
              id="weight"
              class="block w-full text-sm h-[50px] px-4 text-slate-900 bg-white rounded-[8px] border border-violet-200 appearance-none focus:border-transparent focus:outline focus:outline-2 focus:outline-primary focus:ring-0 peer pr-[48px]"
              placeholder="Weight (number)"
              required
            />
            <label
              for="weight"
              class="peer-placeholder-shown:-z-10 peer-focus:z-10 absolute text-[14px] leading-[150%] text-primary duration-300 transform -translate-y-[1.2rem] scale-75 top-2 z-10 origin-[0] bg-white px-2 peer-placeholder-shown:scale-100 peer-placeholder-shown:-translate-y-1/2 peer-placeholder-shown:top-1/2 peer-focus:top-2 peer-focus:scale-75 peer-focus:-translate-y-[1.2rem] start-1"
            >
              weight
            </label>
          </div>

          <!-- color -->
          <div class="relative">
            <input
              type="text"
              name="color"
              id="color"
              class="block w-full text-sm h-[50px] px-4 text-slate-900 bg-white rounded-[8px] border border-violet-200 appearance-none focus:border-transparent focus:outline focus:outline-2 focus:outline-primary focus:ring-0 peer pr-[48px]"
              placeholder="Color (e.g. Black)"
              required
            />
            <label
              for="color"
              class="peer-placeholder-shown:-z-10 peer-focus:z-10 absolute text-[14px] leading-[150%] text-primary duration-300 transform -translate-y-[1.2rem] scale-75 top-2 z-10 origin-[0] bg-white px-2 peer-placeholder-shown:scale-100 peer-placeholder-shown:-translate-y-1/2 peer-placeholder-shown:top-1/2 peer-focus:top-2 peer-focus:scale-75 peer-focus:-translate-y-[1.2rem] start-1"
            >
              color
            </label>
          </div>

          <!-- habitat -->
          <div class="relative">
            <input
              type="text"
              name="habitat"
              id="habitat"
              class="block w-full text-sm h-[50px] px-4 text-slate-900 bg-white rounded-[8px] border border-violet-200 appearance-none focus:border-transparent focus:outline focus:outline-2 focus:outline-primary focus:ring-0 peer pr-[48px]"
              placeholder="Habitat (e.g. Field)"
              required
            />
            <label
              for="habitat"
              class="peer-placeholder-shown:-z-10 peer-focus:z-10 absolute text-[14px] leading-[150%] text-primary duration-300 transform -translate-y-[1.2rem] scale-75 top-2 z-10 origin-[0] bg-white px-2 peer-placeholder-shown:scale-100 peer-placeholder-shown:-translate-y-1/2 peer-placeholder-shown:top-1/2 peer-focus:top-2 peer-focus:scale-75 peer-focus:-translate-y-[1.2rem] start-1"
            >
              habitat
            </label>
          </div>

          <!-- isWild -->
          <div class="flex items-center gap-3 mt-2">
            <input
              type="checkbox"
              name="isWild"
              id="isWild"
              class="w-5 h-5 accent-violet-600"
            />
            <label for="isWild" class="text-white text-sm select-none">isWild</label>
          </div>
        </div>

        <div class="sm:flex sm:flex-row-reverse flex gap-4">
          <button
            class="w-fit rounded-lg text-sm px-5 py-2 focus:outline-none h-[50px] border bg-violet-500 hover:bg-violet-600 focus:bg-violet-700 text-white focus:ring-4 focus:ring-violet-200 hover:ring-4 hover:ring-violet-100 transition-all duration-300"
            type="submit"
          >
            <div class="flex gap-2 items-center">Submit</div>
          </button>

          <a href="./index.html">
            <button
              class="w-fit rounded-lg text-sm px-5 py-2 h-[50px] border bg-transparent border-red-500 text-red-500 hover:bg-red-500 hover:text-white focus:outline-none focus:ring-4 focus:ring-red-200 transition"
              type="button"
            >
              Cancel
            </button>
          </a>
        </div>
      </form>
 
    </div>

    
    
    <script src="./node_modules/flowbite/dist/flowbite.min.js"></script>
    <script type="module" src="./js/app.js"></script>

    <script>
      if (
        localStorage.getItem("color-theme") === "dark" ||
        (!("color-theme" in localStorage) &&
          window.matchMedia("(prefers-color-scheme: dark)").matches)
      ) {
        document.documentElement.classList.add("dark");
      } else {
        document.documentElement.classList.remove("dark");
      }
    </script>
  </body>
</html>
